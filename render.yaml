services:
  - type: web
    name: audiotrack
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: audiotrack-db
          property: connectionString

databases:
  - name: audiotrack-db
    databaseName: audiotrack
    user: audiotrack
    plan: free
